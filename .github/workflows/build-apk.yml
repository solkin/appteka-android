name: Appteka Build
permissions:
  contents: write
on:
  pull_request:
    branches:
      - master
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > tomclaw.keystore

      - name: Build APK
        run: ./gradlew assembleRelease -PstoreFile=tomclaw.keystore -PstorePassword=${{ secrets.STORE_PASSWORD }} -PkeyAlias=${{ secrets.KEY_ALIAS }} -PkeyPassword=${{ secrets.KEY_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: appteka-apk-release-${{ github.run_id }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: ${{ startsWith(github.ref, 'refs/tags/') && 90 || 7 }}

      - name: Publish release to Bananalytics
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        env:
          BANANALYTICS_KEY: ${{ secrets.BANANALYTICS_KEY }}
        run: |
          apk=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          mapping=$(find app/build/outputs/mapping/release -name 'mapping.txt' | head -n 1)
          [ -n "$apk" ] || { echo "Release APK not found"; exit 1; }
          [ -n "$mapping" ] || { echo "R8 mapping not found"; exit 1; }
          # The mapping is ~30 MB of text and is stored compressed anyway.
          gzip -9 -c "$mapping" > mapping.txt.gz
          curl --fail-with-body -X POST https://bnn.appteka.store/api/v1/releases \
            -H "X-API-Key: $BANANALYTICS_KEY" \
            -F apk=@"$apk" \
            -F mapping=@mapping.txt.gz \
            -F release_notes="$(git log -1 --pretty=%s)" \
            -F notify=true
